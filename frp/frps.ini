[common]
bind_port = 7000
bind_udp_port = 7001
dashboard_port = 7500
dashboard_user = admin
dashboard_pwd = admin123
token = your_frp_token_here

# Enable dashboard for monitoring
dashboard_addr = 0.0.0.0

# Log configuration
log_file = /var/log/frps.log
log_level = info
log_max_days = 3

# Authentication
authentication_method = token
authentication_timeout = 900 