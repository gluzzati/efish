[common]
server_addr = your_vps_ip_here
server_port = 7000
token = your_frp_token_here

# Authentication
authentication_method = token

# Log configuration
log_file = /var/log/frpc.log
log_level = info
log_max_days = 3

[file-server]
type = tcp
local_ip = 127.0.0.1
local_port = 80
remote_port = {dynamic_port}
use_compression = true 