version: '3.8'

services:
  frps:
    build:
      context: .
      dockerfile: Dockerfile.frps
    container_name: frps-server
    restart: unless-stopped
    ports:
      - "45413:45413"  # FRP server port
      - "45414:45414"  # FRP UDP port
      - "45415:45415"  # FRP dashboard port
    volumes:
      - ./logs:/var/log
    environment:
      - FRP_TOKEN=${FRP_TOKEN:-your_frp_token_here}
    networks:
      - frp-network

networks:
  frp-network:
    driver: bridge 