services:
  frps:
    image: snowdreamtech/frps:latest
    container_name: frps-server
    restart: unless-stopped
    ports:
      - "45413:45413"  # FRP server port
      - "45414:45414"  # FRP UDP port
      - "45415:45415"  # FRP dashboard port
    volumes:
      - ./frps.ini:/etc/frp/frps.ini:ro
      - ./logs:/var/log
    command: ["frps", "-c", "/etc/frp/frps.ini"]
    networks:
      - frp-network

networks:
  frp-network:
    driver: bridge 