networks:
  traefik-network:
    external: true

services:
  file-sharer:
    build:
      context: .
      dockerfile: ./app/Dockerfile
    container_name: file-sharer
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
      - MAX_TUNNEL_SECONDS=${MAX_TUNNEL_SECONDS:-3600}
      - STALL_TIMEOUT_SECONDS=${STALL_TIMEOUT_SECONDS:-300}
      - GRACE_PERIOD_SECONDS=${GRACE_PERIOD_SECONDS:-3600}
      - NAS_MOUNT_PATH=/data
      - FRP_SERVER_ADDR=${FRP_SERVER_ADDR:-your_vps_ip_here}
      - FRP_SERVER_PORT=${FRP_SERVER_PORT:-7000}
      - FRP_TOKEN=${FRP_TOKEN:-your_frp_token_here}
      - DYNAMIC_PORT_SECRET=${DYNAMIC_PORT_SECRET:-your_shared_secret_here}
      - DYNAMIC_BASE_PORT=${DYNAMIC_BASE_PORT:-30000}
      - DYNAMIC_PORT_RANGE=${DYNAMIC_PORT_RANGE:-1000}
      - DYNAMIC_PORT_INTERVAL=${DYNAMIC_PORT_INTERVAL:-300}
    volumes:
      - /path/to/your/data:/data:ro
      - ./logs:/logs
      - /var/run/docker.sock:/var/run/docker.sock
      - ./web:/app/web
      - ./tunnels:/tunnels  # Mount tunnels directory for symlink management
      - ./frp:/frp  # Mount FRP configuration directory
    depends_on:
      - redis
      - nginx
    labels:
      - "traefik.enable=true"
      # --- IMPORTANT ---
      # Change the Host rule to your desired domain
      - "traefik.http.routers.filesharer-http.rule=Host(`domain.com`)"
      - "traefik.http.routers.filesharer-http.entrypoints=web"
      - "traefik.http.routers.filesharer-https.rule=Host(`domain.com`)"
      - "traefik.http.routers.filesharer-https.entrypoints=websecure"
      - "traefik.http.routers.filesharer-https.tls=true"
      - "traefik.http.services.filesharer.loadbalancer.server.port=8000"
      # --- IMPORTANT ---
      # This assumes your traefik network is named 'traefik-network'. Change if needed.
      - "traefik.docker.network=traefik-network"
    networks:
      - traefik-network

  nginx:
    image: nginx:alpine
    container_name: file-server
    restart: unless-stopped
    volumes:
      - /path/to/your/data:/data:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs:/var/log/nginx
      - ./tunnels:/tunnels  # Mount tunnels directory for symlinks
      - /dev/null:/etc/nginx/conf.d/default.conf  # Override default config
    expose:
      - "80"  # Only expose within Docker network
    networks:
      - traefik-network

  redis:
    image: redis:alpine
    container_name: redis-state
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - traefik-network

  # FRP Client (Homelab side)
  frpc:
    image: snowdreamtech/frpc:latest
    container_name: frpc-client
    restart: unless-stopped
    # Share network namespace with nginx to access the file server
    network_mode: "service:nginx"
    environment:
      - FRP_SERVER_ADDR=${FRP_SERVER_ADDR:-your_vps_ip_here}
      - FRP_SERVER_PORT=${FRP_SERVER_PORT:-7000}
      - FRP_TOKEN=${FRP_TOKEN:-your_frp_token_here}
    volumes:
      - ./frp:/etc/frp
      - ./logs:/var/log
    command: ["frpc", "-c", "/etc/frp/frpc.ini"]
    depends_on:
      - nginx

  # FRP Server (VPS side) - Uncomment and configure for VPS deployment
  # frps:
  #   image: snowdreamtech/frps:latest
  #   container_name: frps-server
  #   restart: unless-stopped
  #   ports:
  #     - "7000:7000"  # FRP server port
  #     - "7001:7001"  # FRP UDP port
  #     - "7500:7500"  # FRP dashboard port
  #   volumes:
  #     - ./frp/frps.ini:/etc/frp/frps.ini:ro
  #     - ./logs:/var/log
  #   command: ["frps", "-c", "/etc/frp/frps.ini"]

volumes:
  redis-data:
